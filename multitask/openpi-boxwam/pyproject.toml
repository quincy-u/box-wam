[project]
name = "openpi"
version = "0.1.0"
description = "Physical Intelligence open source repo"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "augmax>=0.3.4",
    "dm-tree>=0.1.8",
    "einops>=0.8.0",
    "equinox>=0.11.8",
    "flatbuffers>=24.3.25",
    "flax>=0.10.2",
    "fsspec[gcs]>=2024.6.0",
    "gym-aloha>=0.1.1",
    "imageio>=2.36.1",
    # NOTE: JAX >= 0.6.0 ships CUDA 12.8 wheels with sm_120 (Blackwell) SASS prebuilt;
    # earlier versions only ship sm_90 SASS and PTX-JIT to sm_120, which is slow at compile
    # and OOMs the host RAM during the pi0.5 graph compile.
    "jax[cuda12]>=0.6.0",
    "jaxtyping>=0.2.36",
    "lerobot",
    "ml_collections==1.0.0",
    # NOTE: jax >= 0.7 requires numpy >= 2.0.
    "numpy>=2.0",
    "numpydantic>=1.6.6",
    "opencv-python>=4.10.0.84",
    "openpi-client",
    # NOTE: orbax-checkpoint <= 0.11.13 references jax.experimental.layout.DeviceLocalLayout,
    # which was removed in JAX 0.7. Pinning to >=0.11.30 (latest 0.11.x line, which patches
    # the import to the new layout API) keeps us compatible.
    "orbax-checkpoint>=0.11.30",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.0",
    # NOTE: torch >= 2.8 ships cu128 wheels with sm_120 (Blackwell) kernels prebuilt,
    # and uses cuDNN 9.10 which aligns with the JAX 0.6+ requirement.
    "torch>=2.8.0",
    # direct dependency (otherwise only pulled in by lerobot) so that it comes from the same cu128 index as torch
    "torchvision",
    "tqdm-loggable>=0.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb>=0.19.1",
    "filelock>=3.16.1",
    "beartype==0.19.0",
    "chex>=0.1.90",
    "treescope>=0.1.7",
    "transformers==4.53.2",
    "rich>=14.0.0",
    "polars>=1.30.0",
]


[project.urls]
Repository = "https://github.com/Physical-Intelligence/openpi"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.0",
    "pynvml>=12.0.0",
]
# rlds group temporarily disabled: dlimp pins tensorflow-cpu==2.15.0 which
# conflicts with the ml-dtypes>=0.5 required by JAX>=0.7 (Blackwell support).
# Re-enable once dlimp is updated or the DROID path is needed.
# rlds = [
#     "dlimp",
#     "tensorflow-cpu==2.15.0",
#     "tensorflow-datasets==4.9.9",
# ]

[tool.uv]
# These move with JAX: jax >= 0.7 needs ml-dtypes >= 0.5 (float8_e3m4 dtype).
override-dependencies = ["ml-dtypes>=0.5.0", "tensorstore>=0.1.74"]

[tool.uv.sources]
openpi-client = { workspace = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
dlimp = { git = "https://github.com/kvablack/dlimp", rev = "ad72ce3a9b414db2185bc0b38461d4101a65477a" }
# PyTorch's CUDA 12.8 builds: PyPI's torch >= 2.9 wheels are CUDA 13 builds whose nvidia-nccl-cu13 overwrites the
# nvidia-nccl-cu12 that jax[cuda12] installs (same file, nvidia/nccl/lib/libnccl.so.2), so torch or JAX fails to load
# depending on install order. With cu128 both share one set of CUDA 12 libraries (sm_120 / Blackwell included).
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docker", "third_party", "src/openpi/models_pytorch/transformers_replace/*"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",   # Conflicts with array typing.
    "T201",   # We use print statements.
    "PD008",  # Lots of false positives.
    "ISC001", # Disabling to support ruff format.
    "LOG015", # Use logger.info.
]
unfixable = [
    "B905", # Fix defaults to strict=False, which is not what we want.
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["src", "scripts", "packages"]
