# Standalone Box-WAM policy for the real-robot "water the plant" task: a single 7-DoF xArm7 with a
# gripper (8-dim state/action), a third-person scene camera and a wrist camera, 50-step chunks.
#
#   python scripts/train.py --config configs/train/real_world/water_plant.yaml --devices cuda:0 cuda:1
run_name: real_world-water_plant

data:
  episodes: data/real_world/water_plant/episodes.txt
  stats: data/real_world/water_plant/action_stats.npz   # --horizon 50 --gripper-dims 7
  cameras: [image_scene_d455, image_wrist_d435i]
  gripper_dims: [7]
  val_fraction: 0.02
  preload: true
  num_workers: 8
  batch_size: 128

augmentation:
  crop_size: 224
  crop_scale: [0.875, 1.0]
  crop_ratio: [1.0, 1.0]
  rotation_degrees: [-5.0, 5.0]
  brightness: [0.7, 1.3]
  contrast: [0.6, 1.4]
  saturation: [0.5, 1.5]
  hue: [-0.05, 0.05]

model:
  state_dim: 8
  action_dim: 8
  horizon: 50
  box_dim: 16                               # the active object: mug -> pod -> machine
  action_attend_box: true                   # actions read the imagined box trajectory ...
  box_attend_action: false                  # ... but the boxes do not depend on the actions
  drop_path: 0.1
  activation_checkpointing: true
  compile: true

loss:
  action_weight: 2.0
  box_weight: 1.0
  val_steps: 10

optim:
  epochs: 50
  steps_per_epoch: 300
  lr: 1.0e-4
  start_lr: 5.25e-5
  final_lr: 1.0e-4
  warmup_epochs: 5
  weight_decay: 0.04
  final_weight_decay: 0.04

seed: 239
dtype: bfloat16
save_every: 5
