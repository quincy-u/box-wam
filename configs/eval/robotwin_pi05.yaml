# Evaluate pi0.5 + Box-WAM in RoboTwin 2.0 through an openpi policy server. Start the server first
# from openpi-boxwam (see multitask/README.md):
#
#   uv run scripts/serve_policy.py --port 8000 policy:checkpoint \
#       --policy.config pi05_robotwin_boxwam --policy.dir checkpoints/pi05_robotwin_boxwam/<exp>/34999
#
# then:  python scripts/evaluate_robotwin.py --config configs/eval/robotwin_pi05.yaml --tasks open_laptop
robotwin:
  root: eval/RoboTwin-boxwam                 # relative paths are relative to this repository
  # python: ~/miniconda3/envs/RoboTwin/bin/python   # default: the interpreter running this script
  gpus: [0]
  timeout_minutes: 480
  stall_minutes: 10                          # kill and retry a run whose log stops growing (simulator hangs)
  retries: 2

policy: pi05
label: pi05_robotwin_boxwam
tasks:                                       # the 50 RoboTwin 2.0 tasks of the paper; override with --tasks
  - adjust_bottle
  - beat_block_hammer
  - blocks_ranking_rgb
  - blocks_ranking_size
  - click_alarmclock
  - click_bell
  - dump_bin_bigbin
  - grab_roller
  - handover_block
  - handover_mic
  - hanging_mug
  - lift_pot
  - move_can_pot
  - move_pillbottle_pad
  - move_playingcard_away
  - move_stapler_pad
  - open_laptop
  - open_microwave
  - pick_diverse_bottles
  - pick_dual_bottles
  - place_a2b_left
  - place_a2b_right
  - place_bread_basket
  - place_bread_skillet
  - place_burger_fries
  - place_can_basket
  - place_cans_plasticbox
  - place_container_plate
  - place_dual_shoes
  - place_empty_cup
  - place_fan
  - place_mouse_pad
  - place_object_basket
  - place_object_scale
  - place_object_stand
  - place_phone_stand
  - place_shoe
  - press_stapler
  - put_bottles_dustbin
  - put_object_cabinet
  - rotate_qrcode
  - scan_object
  - shake_bottle
  - shake_bottle_horizontally
  - stack_blocks_three
  - stack_blocks_two
  - stack_bowls_three
  - stack_bowls_two
  - stamp_seal
  - turn_switch
task_config: demo_randomized
seeds: [0]
episodes: 100
instruction_type: unseen
num_open_loop_steps: 36                      # the model predicts 50 steps; execute 36 before re-planning
save_boxes: true                             # keep the predicted box trajectories (results/<label>/<task_config>/boxes/)
render_boxes: true                           # draw them onto the rollout videos (results/<label>/<task_config>/videos/)

pi05:
  server: 127.0.0.1:8000
  state: endpose                             # 16-dim end-effector interface of the released model (joint: 14-dim joints)
